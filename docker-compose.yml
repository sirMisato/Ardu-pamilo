name: pamilo-saas

services:
  reverse-proxy:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtt.address=:1883
      - --entrypoints.mqtts.address=:8883
      - --entrypoints.mqttws.address=:8083
      - --entrypoints.mqttwss.address=:8084
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@sedayafarm.keycloud.id}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - public-edge

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-https://sedayafarm.keycloud.id}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sedayafarm.keycloud.id}
        VITE_MQTT_BROKER_URL: ${VITE_MQTT_BROKER_URL:-mqtts://mqtt.keycloud.id:8883}
        VITE_MQTT_WEBSOCKET_URL: ${VITE_MQTT_WEBSOCKET_URL:-wss://mqtt.keycloud.id:8084/mqtt}
        VITE_BMKG_FORECAST_BASE_URL: ${VITE_BMKG_FORECAST_BASE_URL:-https://api.bmkg.go.id/publik/prakiraan-cuaca}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - public-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DEMO_TENANT_EMAIL: ${DEMO_TENANT_EMAIL:-tenant@sedayafarm.local}
      DEMO_TENANT_ENABLED: ${DEMO_TENANT_ENABLED:-false}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo-tenant}
      DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-PAMILO Demo Farm}
      DEMO_TENANT_PASSWORD: ${DEMO_TENANT_PASSWORD:-}
      DEMO_TENANT_RESET_DATA: ${DEMO_TENANT_RESET_DATA:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://sedayafarm.keycloud.id}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://emqx:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-pamilo-api-production}
      MQTT_INGEST_ENABLED: ${MQTT_INGEST_ENABLED:-true}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-pamilo/v1/tenants/+/devices/+/telemetry}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      NODE_ENV: production
      PORT: 3000
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD_HASH: ${SUPER_ADMIN_PASSWORD_HASH:-}
    expose:
      - "3000"
    networks:
      - public-edge
      - mqtt-private
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      start_period: 30s
      interval: 20s
      timeout: 10s
      retries: 6

  emqx:
    image: emqx/emqx:5.8
    hostname: emqx
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: emqx@emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_DASHBOARD_USERNAME:?set EMQX_DASHBOARD_USERNAME}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD}"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./infra/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./infra/emqx/auth-built-in-db-bootstrap.csv:/opt/emqx/etc/auth-built-in-db-bootstrap.csv:ro
    expose:
      - "1883"
      - "8083"
      - "18083"
    ports:
      - "127.0.0.1:18083:18083"
    networks:
      - public-edge
      - mqtt-private
    healthcheck:
      test: ["CMD-SHELL", "/opt/emqx/bin/emqx_ctl status >/dev/null 2>&1 || /opt/emqx/bin/emqx ctl status >/dev/null 2>&1"]
      start_period: 60s
      interval: 30s
      timeout: 15s
      retries: 10

networks:
  public-edge:
    name: pamilo-public-edge
    driver: bridge
  mqtt-private:
    name: pamilo-mqtt-private
    driver: bridge
    internal: true

volumes:
  emqx-data:
  emqx-log:
  traefik-letsencrypt:
