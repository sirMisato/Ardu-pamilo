name: pamilo-saas

services:
  edge:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtt.address=:1883
      - --entrypoints.mqtts.address=:8883
      - --entrypoints.mqttws.address=:8083
      - --entrypoints.mqttwss.address=:8084
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@sedayafarm.keycloud.id}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    depends_on:
      frontend:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - public-edge

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-https://sedayafarm.keycloud.id}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sedayafarm.keycloud.id}
        VITE_MQTT_BROKER_URL: ${VITE_MQTT_BROKER_URL:-mqtts://mqtt.keycloud.id:8883}
        VITE_MQTT_WEBSOCKET_URL: ${VITE_MQTT_WEBSOCKET_URL:-wss://mqtt.keycloud.id:8084/mqtt}
        VITE_BMKG_FORECAST_BASE_URL: ${VITE_BMKG_FORECAST_BASE_URL:-https://api.bmkg.go.id/publik/prakiraan-cuaca}
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=pamilo-public-edge
      - traefik.http.routers.pamilo-web.rule=Host(`${WEB_HOST:-sedayafarm.keycloud.id}`)
      - traefik.http.routers.pamilo-web.entrypoints=websecure
      - traefik.http.routers.pamilo-web.tls.certresolver=letsencrypt
      - traefik.http.routers.pamilo-web.service=pamilo-web
      - traefik.http.services.pamilo-web.loadbalancer.server.port=80
    networks:
      - public-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6

  emqx:
    image: emqx/emqx:5.8
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: emqx@emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:?set EMQX_DASHBOARD_USERNAME}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./infra/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./infra/emqx/certs:/opt/emqx/certs:ro
    expose:
      - "1883"
      - "8883"
      - "8083"
      - "8084"
    ports:
      - "127.0.0.1:18083:18083"
    labels:
      - traefik.enable=true
      - traefik.docker.network=pamilo-public-edge
      - traefik.tcp.routers.emqx-mqtt.rule=HostSNI(`*`)
      - traefik.tcp.routers.emqx-mqtt.entrypoints=mqtt
      - traefik.tcp.routers.emqx-mqtt.service=emqx-mqtt
      - traefik.tcp.services.emqx-mqtt.loadbalancer.server.port=1883
      - traefik.tcp.routers.emqx-mqtts.rule=HostSNI(`${MQTT_HOST:-mqtt.keycloud.id}`)
      - traefik.tcp.routers.emqx-mqtts.entrypoints=mqtts
      - traefik.tcp.routers.emqx-mqtts.tls.certresolver=letsencrypt
      - traefik.tcp.routers.emqx-mqtts.service=emqx-mqtt
      - traefik.http.routers.emqx-ws.rule=Host(`${MQTT_HOST:-mqtt.keycloud.id}`) && PathPrefix(`/mqtt`)
      - traefik.http.routers.emqx-ws.entrypoints=mqttws
      - traefik.http.routers.emqx-ws.service=emqx-ws
      - traefik.http.routers.emqx-wss.rule=Host(`${MQTT_HOST:-mqtt.keycloud.id}`) && PathPrefix(`/mqtt`)
      - traefik.http.routers.emqx-wss.entrypoints=mqttwss
      - traefik.http.routers.emqx-wss.tls.certresolver=letsencrypt
      - traefik.http.routers.emqx-wss.service=emqx-ws
      - traefik.http.services.emqx-ws.loadbalancer.server.port=8083
    networks:
      - public-edge
      - mqtt-private
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 20s
      timeout: 10s
      retries: 6

networks:
  public-edge:
    name: pamilo-public-edge
    driver: bridge
  mqtt-private:
    name: pamilo-mqtt-private
    driver: bridge
    internal: true

volumes:
  emqx-data:
  emqx-log:
  traefik-letsencrypt:
