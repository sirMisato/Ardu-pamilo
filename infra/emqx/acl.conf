%% Bootstrap ACL. Replace with database-backed EMQX authorization for production scale.
{allow, {username, "pamilo_ingestor"}, publish, [
  "pamilo/v1/tenants/+/devices/+/telemetry",
  "pamilo/v1/tenants/+/devices/+/status",
  "pamilo/v1/tenants/+/devices/+/events"
]}.

{allow, {username, "pamilo_ingestor"}, subscribe, [
  "pamilo/v1/tenants/+/devices/+/telemetry",
  "pamilo/v1/tenants/+/devices/+/status",
  "pamilo/v1/tenants/+/devices/+/events"
]}.

%% Demo tenant device publisher. Create this user in EMQX built-in database.
{allow, {username, "pamilo_device_demo"}, publish, [
  "pamilo/v1/tenants/demo-tenant/devices/+/telemetry",
  "pamilo/v1/tenants/demo-tenant/devices/+/status",
  "pamilo/v1/tenants/demo-tenant/devices/+/events"
]}.

%% Demo browser subscriber. Use only for local/demo because Vite env values are public in browser bundles.
{allow, {username, "pamilo_web_demo"}, subscribe, [
  "pamilo/v1/tenants/demo-tenant/devices/+/telemetry",
  "pamilo/v1/tenants/demo-tenant/devices/+/status",
  "pamilo/v1/tenants/demo-tenant/devices/+/events"
]}.

{deny, all}.
