name: pamilo-staging

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${PAMILO_API_IMAGE:?PAMILO_API_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES:-262144}
      API_TRUSTED_ORIGINS: ${API_TRUSTED_ORIGINS:?API_TRUSTED_ORIGINS is required}
      REDIS_URL: redis://redis:6379
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      MQTT_URL: mqtt://mosquitto:1883
      BMKG_BASE_URL: https://api.bmkg.go.id
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
      victoriametrics:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *service-logging
    networks:
      - app
      - data

  web:
    image: ${PAMILO_WEB_IMAGE:?PAMILO_WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${PAMILO_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/health/live
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *service-logging
    networks:
      - edge
      - app

  mqtt-ingestor:
    image: ${PAMILO_MQTT_INGESTOR_IMAGE:?PAMILO_MQTT_INGESTOR_IMAGE is required}
    profiles:
      - worker-self-check
    restart: "no"
    environment:
      NODE_ENV: production
      MQTT_URL: mqtt://mosquitto:1883
      REDIS_URL: redis://redis:6379
      VICTORIA_METRICS_URL: http://victoriametrics:8428
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging: *service-logging
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *service-logging
    networks:
      - data

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    restart: unless-stopped
    command:
      - -retentionPeriod=1
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    logging: *service-logging
    networks:
      - data

  mosquitto:
    image: eclipse-mosquitto:2
    profiles:
      - worker-self-check
    restart: unless-stopped
    volumes:
      - ./mosquitto.self-check.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    logging: *service-logging
    networks:
      - data

networks:
  edge:
  app:
  data:
    internal: true

volumes:
  redis-data:
  victoriametrics-data:
  mosquitto-data:
