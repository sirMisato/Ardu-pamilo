name: pamilo-production

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  api:
    image: ${PAMILO_API_IMAGE:?PAMILO_API_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES:-262144}
      API_TRUSTED_ORIGINS: ${API_TRUSTED_ORIGINS:?API_TRUSTED_ORIGINS is required}
      REDIS_URL: redis://redis:6379
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      TELEMETRY_STORAGE_ADAPTER: redis-victoria-hybrid
      BMKG_WEATHER_ADAPTER: ${BMKG_WEATHER_ADAPTER:-http}
      BMKG_WEATHER_BASE_URL: ${BMKG_WEATHER_BASE_URL:-https://api.bmkg.go.id/publik/prakiraan-cuaca}
      BMKG_WEATHER_CACHE_TTL_MS: ${BMKG_WEATHER_CACHE_TTL_MS:-21600000}
      BMKG_WEATHER_TIMEOUT_MS: ${BMKG_WEATHER_TIMEOUT_MS:-8000}
      PAMILO_MYSQL_MODE: ${PAMILO_MYSQL_MODE:-not_configured_until_tls_decision}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_TLS_REJECT_UNAUTHORIZED: ${MYSQL_TLS_REJECT_UNAUTHORIZED:-true}
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
      victoriametrics:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *service-logging
    networks:
      - app
      - data

  web:
    image: ${PAMILO_WEB_IMAGE:?PAMILO_WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAMILO_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/health/live
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *service-logging
    networks:
      - edge
      - app

  mqtt-ingestor:
    image: ${PAMILO_MQTT_INGESTOR_IMAGE:?PAMILO_MQTT_INGESTOR_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MQTT_INGESTOR_MODE: daemon
      MQTT_URL: mqtt://emqx:1883
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-pamilo-production-ingestor}
      MQTT_USERNAME: ${MQTT_SERVICE_USERNAME:?MQTT_SERVICE_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_SERVICE_PASSWORD:?MQTT_SERVICE_PASSWORD is required}
      REDIS_URL: redis://redis:6379
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      PAMILO_DEVICE_PLOT_MAP: ${PAMILO_DEVICE_PLOT_MAP:-{}}
      PAMILO_MQTT_DEDUP_TTL_SECONDS: ${PAMILO_MQTT_DEDUP_TTL_SECONDS:-604800}
    depends_on:
      redis:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      emqx:
        condition: service_healthy
    logging: *service-logging
    networks:
      - data

  emqx:
    image: ${EMQX_IMAGE:?EMQX_IMAGE is required}
    hostname: pamilo-emqx
    restart: unless-stopped
    ports:
      - "${PAMILO_EMQX_MQTTS_PORT:-8883}:8883"
      - "127.0.0.1:${PAMILO_EMQX_DASHBOARD_PORT:-18083}:18083"
    expose:
      - "1883"
    environment:
      EMQX_NODE__NAME: '"emqx@pamilo-emqx"'
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: '"${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD is required}"'
      EMQX_LISTENERS__TCP__DEFAULT__BIND: '"0.0.0.0:1883"'
      EMQX_LISTENERS__SSL__DEFAULT__BIND: '"0.0.0.0:8883"'
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: '"/opt/emqx/etc/certs/pamilo-mqtt-fullchain.pem"'
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: '"/opt/emqx/etc/certs/pamilo-mqtt-privkey.pem"'
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_none
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "false"
      EMQX_AUTHENTICATION: '[{"mechanism":"password_based","backend":"built_in_database","user_id_type":"username","password_hash_algorithm":{"name":"bcrypt","salt_position":"suffix"}}]'
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES: '[{"type":"file","enable":true,"path":"/opt/emqx/etc/acl.conf"}]'
      EMQX_ALLOW_ANONYMOUS: "false"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./certs/mqtt/fullchain.pem:/opt/emqx/etc/certs/pamilo-mqtt-fullchain.pem:ro
      - ./certs/mqtt/privkey.pem:/opt/emqx/etc/certs/pamilo-mqtt-privkey.pem:ro
    healthcheck:
      test:
        - CMD
        - /opt/emqx/bin/emqx
        - ctl
        - status
      interval: 15s
      timeout: 10s
      retries: 8
    logging: *service-logging
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *service-logging
    networks:
      - data

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    restart: unless-stopped
    command:
      - -retentionPeriod=${VICTORIA_METRICS_RETENTION_PERIOD:-12}
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    logging: *service-logging
    networks:
      - data

networks:
  edge:
  app:
  data:
    internal: true

volumes:
  emqx-data:
  emqx-log:
  redis-data:
  victoriametrics-data:
