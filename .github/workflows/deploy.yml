name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: Run the VPS deployment after validation
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
        env:
          EMQX_DASHBOARD_USERNAME: admin
          EMQX_DASHBOARD_PASSWORD: placeholder
          LETSENCRYPT_EMAIL: admin@sedayafarm.keycloud.id
          MQTT_HOST: mqtt.keycloud.id
          VITE_API_BASE_URL: https://sedayafarm.keycloud.id
          VITE_BMKG_FORECAST_BASE_URL: https://api.bmkg.go.id/publik/prakiraan-cuaca
          VITE_MQTT_BROKER_URL: mqtts://mqtt.keycloud.id:8883
          VITE_MQTT_WEBSOCKET_URL: wss://mqtt.keycloud.id:8084/mqtt
          VITE_WEB_BASE_URL: https://sedayafarm.keycloud.id
          WEB_HOST: sedayafarm.keycloud.id

      - name: Skip VPS deploy
        run: echo "VPS deployment is paused. Run this workflow manually with deploy_to_vps=true when ready."

  deploy:
    name: Deploy to VPS
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps == true }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          EMQX_DASHBOARD_PASSWORD: ${{ secrets.EMQX_DASHBOARD_PASSWORD }}
          EMQX_DASHBOARD_USERNAME: ${{ secrets.EMQX_DASHBOARD_USERNAME }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          MQTT_HOST: ${{ vars.MQTT_HOST }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          REPO_TOKEN: ${{ github.token }}
          SUDO_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BMKG_FORECAST_BASE_URL: ${{ vars.VITE_BMKG_FORECAST_BASE_URL }}
          VITE_MQTT_BROKER_URL: ${{ vars.VITE_MQTT_BROKER_URL }}
          VITE_MQTT_WEBSOCKET_URL: ${{ vars.VITE_MQTT_WEBSOCKET_URL }}
          VITE_WEB_BASE_URL: ${{ vars.VITE_WEB_BASE_URL }}
          WEB_HOST: ${{ vars.WEB_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,EMQX_DASHBOARD_PASSWORD,EMQX_DASHBOARD_USERNAME,LETSENCRYPT_EMAIL,MQTT_HOST,REF_NAME,REPOSITORY,REPO_TOKEN,SUDO_PASSWORD,VITE_API_BASE_URL,VITE_BMKG_FORECAST_BASE_URL,VITE_MQTT_BROKER_URL,VITE_MQTT_WEBSOCKET_URL,VITE_WEB_BASE_URL,WEB_HOST
          script: |
            set -euo pipefail

            sudo_run() {
              if sudo -n true 2>/dev/null; then
                sudo "$@"
                return
              fi

              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
            }

            install_docker_if_missing() {
              if command -v docker >/dev/null 2>&1; then
                if sudo_run docker compose version >/dev/null 2>&1; then
                  echo "Docker and Docker Compose are already available on this VPS."
                  return
                fi

                echo "Docker CLI is present, but Docker Compose plugin is missing. Installing Docker packages."
              else
                echo "Docker CLI is missing. Installing Docker Engine and Docker Compose plugin."
              fi

              if ! command -v apt-get >/dev/null 2>&1; then
                echo "Docker is missing and automatic installation currently supports apt-based VPS images only."
                exit 1
              fi

              . /etc/os-release
              docker_repo_os="${ID:-}"
              if [ "$docker_repo_os" != "ubuntu" ] && [ "$docker_repo_os" != "debian" ]; then
                case "${ID_LIKE:-}" in
                  *ubuntu*) docker_repo_os="ubuntu" ;;
                  *debian*) docker_repo_os="debian" ;;
                  *)
                    echo "Docker is missing and this OS is not recognized as Ubuntu/Debian compatible."
                    exit 1
                    ;;
                esac
              fi

              docker_codename="${VERSION_CODENAME:-${UBUNTU_CODENAME:-}}"
              if [ -z "$docker_codename" ] && command -v lsb_release >/dev/null 2>&1; then
                docker_codename="$(lsb_release -cs)"
              fi

              if [ -z "$docker_codename" ]; then
                echo "Unable to determine OS codename for Docker apt repository."
                exit 1
              fi

              echo "Using Docker apt repository for ${docker_repo_os} ${docker_codename}."
              sudo_run apt-get update
              sudo_run apt-get install -y ca-certificates curl gnupg
              sudo_run install -m 0755 -d /etc/apt/keyrings
              curl -fsSL "https://download.docker.com/linux/${docker_repo_os}/gpg" | sudo_run tee /etc/apt/keyrings/docker.asc >/dev/null
              sudo_run chmod a+r /etc/apt/keyrings/docker.asc
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/${docker_repo_os} ${docker_codename} stable" | sudo_run tee /etc/apt/sources.list.d/docker.list >/dev/null
              sudo_run apt-get update
              sudo_run apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

              if command -v systemctl >/dev/null 2>&1; then
                sudo_run systemctl enable --now docker
              else
                sudo_run service docker start
              fi

              sudo_run docker version
              sudo_run docker compose version
            }

            ASKPASS_DIR="$(mktemp -d)"
            trap 'rm -rf "$ASKPASS_DIR"' EXIT
            cat > "$ASKPASS_DIR/git-askpass.sh" <<'EOF'
            #!/usr/bin/env sh
            case "$1" in
              *Username*) printf '%s\n' "$GIT_USERNAME" ;;
              *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
              *) printf '\n' ;;
            esac
            EOF
            chmod 700 "$ASKPASS_DIR/git-askpass.sh"

            git_with_token() {
              GIT_ASKPASS="$ASKPASS_DIR/git-askpass.sh" \
                GIT_USERNAME="x-access-token" \
                GIT_PASSWORD="$REPO_TOKEN" \
                git "$@"
            }

            require_env() {
              variable_name="$1"
              eval "variable_value=\${$variable_name:-}"
              if [ -z "$variable_value" ]; then
                echo "Missing required GitHub secret or variable: $variable_name"
                exit 1
              fi
            }

            if [ -z "${APP_DIR:-}" ]; then
              APP_DIR="/opt/pamilo-saas"
              export APP_DIR
            fi

            if [ -z "${WEB_HOST:-}" ]; then
              WEB_HOST="sedayafarm.keycloud.id"
              export WEB_HOST
            fi

            if [ -z "${MQTT_HOST:-}" ]; then
              MQTT_HOST="mqtt.keycloud.id"
              export MQTT_HOST
            fi

            if [ -z "${LETSENCRYPT_EMAIL:-}" ]; then
              LETSENCRYPT_EMAIL="admin@sedayafarm.keycloud.id"
              export LETSENCRYPT_EMAIL
            fi

            if [ -z "${VITE_WEB_BASE_URL:-}" ]; then
              VITE_WEB_BASE_URL="https://${WEB_HOST}"
              export VITE_WEB_BASE_URL
            fi

            if [ -z "${VITE_API_BASE_URL:-}" ]; then
              VITE_API_BASE_URL="https://${WEB_HOST}"
              export VITE_API_BASE_URL
            fi

            if [ -z "${VITE_MQTT_BROKER_URL:-}" ]; then
              VITE_MQTT_BROKER_URL="mqtts://${MQTT_HOST}:8883"
              export VITE_MQTT_BROKER_URL
            fi

            if [ -z "${VITE_MQTT_WEBSOCKET_URL:-}" ]; then
              VITE_MQTT_WEBSOCKET_URL="wss://${MQTT_HOST}:8084/mqtt"
              export VITE_MQTT_WEBSOCKET_URL
            fi

            if [ -z "${VITE_BMKG_FORECAST_BASE_URL:-}" ]; then
              VITE_BMKG_FORECAST_BASE_URL="https://api.bmkg.go.id/publik/prakiraan-cuaca"
              export VITE_BMKG_FORECAST_BASE_URL
            fi

            case "$APP_DIR" in
              ""|"/"|"/opt"|"/opt/")
                echo "Refusing unsafe APP_DIR: $APP_DIR"
                exit 1
                ;;
            esac

            REMOTE_USER="$(id -un)"
            REMOTE_GROUP="$(id -gn)"

            sudo_run mkdir -p "$APP_DIR"
            sudo_run chown -R "$REMOTE_USER:$REMOTE_GROUP" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git_with_token clone "https://github.com/${REPOSITORY}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git_with_token fetch origin "$REF_NAME"
            git checkout "$REF_NAME"
            git reset --hard "origin/$REF_NAME"

            SECRETS_DIR="$APP_DIR/.deploy-secrets"
            mkdir -p "$SECRETS_DIR"
            chmod 700 "$SECRETS_DIR"

            if [ -z "${EMQX_DASHBOARD_USERNAME:-}" ]; then
              EMQX_DASHBOARD_USERNAME="admin"
              export EMQX_DASHBOARD_USERNAME
            fi

            if [ -z "${EMQX_DASHBOARD_PASSWORD:-}" ]; then
              if [ ! -f "$SECRETS_DIR/emqx-dashboard-password" ] || ! grep -Eq '^[A-Za-z0-9]{32,}$' "$SECRETS_DIR/emqx-dashboard-password"; then
                openssl rand -hex 32 > "$SECRETS_DIR/emqx-dashboard-password"
                chmod 600 "$SECRETS_DIR/emqx-dashboard-password"
              fi

              EMQX_DASHBOARD_PASSWORD="$(cat "$SECRETS_DIR/emqx-dashboard-password")"
              export EMQX_DASHBOARD_PASSWORD
            fi

            require_env EMQX_DASHBOARD_PASSWORD
            require_env EMQX_DASHBOARD_USERNAME

            compose() {
              sudo_run env \
                EMQX_DASHBOARD_PASSWORD="$EMQX_DASHBOARD_PASSWORD" \
                EMQX_DASHBOARD_USERNAME="$EMQX_DASHBOARD_USERNAME" \
                LETSENCRYPT_EMAIL="$LETSENCRYPT_EMAIL" \
                MQTT_HOST="$MQTT_HOST" \
                VITE_API_BASE_URL="$VITE_API_BASE_URL" \
                VITE_BMKG_FORECAST_BASE_URL="$VITE_BMKG_FORECAST_BASE_URL" \
                VITE_MQTT_BROKER_URL="$VITE_MQTT_BROKER_URL" \
                VITE_MQTT_WEBSOCKET_URL="$VITE_MQTT_WEBSOCKET_URL" \
                VITE_WEB_BASE_URL="$VITE_WEB_BASE_URL" \
                WEB_HOST="$WEB_HOST" \
                docker compose -f docker-compose.yml "$@"
            }

            test -f apps/web/Dockerfile
            test -f apps/web/package-lock.json
            test -f infra/emqx/base.hocon
            test -f infra/emqx/acl.conf

            echo "Checking Docker availability on VPS."
            install_docker_if_missing
            echo "Docker is ready for deployment."
            compose config --quiet
            compose pull --ignore-buildable
            compose build --pull
            if ! compose up -d --remove-orphans; then
              echo "Compose deployment failed. Recent service logs:"
              compose ps || true
              compose logs --tail=200 emqx || true
              compose logs --tail=120 frontend edge || true
              exit 1
            fi
            compose ps
            if ! compose exec -T emqx sh -lc '/opt/emqx/bin/emqx_ctl status >/dev/null 2>&1 || /opt/emqx/bin/emqx ctl status >/dev/null 2>&1'; then
              echo "EMQX did not report ready after deployment. Recent EMQX logs:"
              compose logs --tail=200 emqx || true
              exit 1
            fi

            sudo_run docker image prune -af --filter "until=168h"
            sudo_run docker builder prune -af --filter "until=168h"
