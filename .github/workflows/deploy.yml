name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
        env:
          PUBLIC_WEB_ORIGIN: https://example.com
          SESSION_SECRET: placeholder-session-secret-for-ci-validation
          MYSQL_HOST: mysql.example.com
          MYSQL_PORT: 3306
          MYSQL_DATABASE: pamilo
          MYSQL_USER: pamilo
          MYSQL_PASSWORD: placeholder
          MQTT_SERVICE_USERNAME: pamilo_ingestor
          MQTT_SERVICE_PASSWORD: placeholder
          EMQX_DASHBOARD_USERNAME: admin
          EMQX_DASHBOARD_PASSWORD: placeholder

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          BMKG_BASE_URL: ${{ vars.BMKG_BASE_URL }}
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          EMQX_DASHBOARD_PASSWORD: ${{ secrets.EMQX_DASHBOARD_PASSWORD }}
          EMQX_DASHBOARD_USERNAME: ${{ secrets.EMQX_DASHBOARD_USERNAME }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MQTT_SERVICE_PASSWORD: ${{ secrets.MQTT_SERVICE_PASSWORD }}
          MQTT_SERVICE_USERNAME: ${{ secrets.MQTT_SERVICE_USERNAME }}
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REPO_TOKEN: ${{ github.token }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SUDO_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,BMKG_BASE_URL,DEPLOY_HOST,EMQX_DASHBOARD_PASSWORD,EMQX_DASHBOARD_USERNAME,MYSQL_DATABASE,MYSQL_HOST,MYSQL_PASSWORD,MYSQL_PORT,MYSQL_USER,MQTT_SERVICE_PASSWORD,MQTT_SERVICE_USERNAME,PUBLIC_WEB_ORIGIN,REF_NAME,REPOSITORY,REPO_TOKEN,SESSION_SECRET,SUDO_PASSWORD
          script: |
            set -euo pipefail

            sudo_run() {
              if sudo -n true 2>/dev/null; then
                sudo "$@"
                return
              fi

              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
            }

            ASKPASS_DIR="$(mktemp -d)"
            trap 'rm -rf "$ASKPASS_DIR"' EXIT
            cat > "$ASKPASS_DIR/git-askpass.sh" <<'EOF'
            #!/usr/bin/env sh
            case "$1" in
              *Username*) printf '%s\n' "$GIT_USERNAME" ;;
              *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
              *) printf '\n' ;;
            esac
            EOF
            chmod 700 "$ASKPASS_DIR/git-askpass.sh"

            git_with_token() {
              GIT_ASKPASS="$ASKPASS_DIR/git-askpass.sh" \
                GIT_USERNAME="x-access-token" \
                GIT_PASSWORD="$REPO_TOKEN" \
                git "$@"
            }

            require_env() {
              variable_name="$1"
              eval "variable_value=\${$variable_name:-}"
              if [ -z "$variable_value" ]; then
                echo "Missing required GitHub secret or variable: $variable_name"
                exit 1
              fi
            }

            if [ -z "${APP_DIR:-}" ]; then
              APP_DIR="/opt/pamilo-saas"
            fi

            if [ -z "${PUBLIC_WEB_ORIGIN:-}" ]; then
              PUBLIC_WEB_ORIGIN="http://${DEPLOY_HOST}"
              export PUBLIC_WEB_ORIGIN
            fi

            case "$APP_DIR" in
              ""|"/"|"/opt"|"/opt/")
                echo "Refusing unsafe APP_DIR: $APP_DIR"
                exit 1
                ;;
            esac

            REMOTE_USER="$(id -un)"
            REMOTE_GROUP="$(id -gn)"

            sudo_run mkdir -p "$APP_DIR"
            sudo_run chown -R "$REMOTE_USER:$REMOTE_GROUP" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git_with_token clone "https://github.com/${REPOSITORY}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git_with_token fetch origin "$REF_NAME"
            git checkout "$REF_NAME"
            git reset --hard "origin/$REF_NAME"

            test -f infra/emqx/base.hocon
            test -f infra/emqx/acl.conf

            if [ ! -f apps/api/Dockerfile ] || [ ! -f apps/web/Dockerfile ]; then
              echo "Application Dockerfiles are not present yet. Repository synced; skipping Docker deploy until app source is generated."
              exit 0
            fi

            require_env EMQX_DASHBOARD_PASSWORD
            require_env EMQX_DASHBOARD_USERNAME
            require_env MYSQL_DATABASE
            require_env MYSQL_HOST
            require_env MYSQL_PASSWORD
            require_env MYSQL_USER
            require_env MQTT_SERVICE_PASSWORD
            require_env MQTT_SERVICE_USERNAME
            require_env PUBLIC_WEB_ORIGIN
            require_env SESSION_SECRET

            mkdir -p infra/emqx/certs
            if [ ! -f infra/emqx/certs/server.crt ] || [ ! -f infra/emqx/certs/server.key ]; then
              openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout infra/emqx/certs/server.key \
                -out infra/emqx/certs/server.crt \
                -subj "/CN=pamilo-emqx"
              chmod 600 infra/emqx/certs/server.key
            fi

            sudo_run docker compose -f docker-compose.yml config --quiet
            sudo_run docker compose -f docker-compose.yml pull --ignore-buildable
            sudo_run docker compose -f docker-compose.yml build --pull
            sudo_run docker compose -f docker-compose.yml up -d --remove-orphans
            sudo_run docker compose -f docker-compose.yml ps

            sudo_run docker image prune -af --filter "until=168h"
            sudo_run docker builder prune -af --filter "until=168h"
