name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-images:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.api
          push: false
          tags: pamilo-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.web
          push: false
          tags: pamilo-web:ci

      - name: Build MQTT ingestor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.mqtt-ingestor
          push: false
          tags: pamilo-mqtt-ingestor:ci
