name: Public VPS Simulation

on:
  workflow_dispatch:
    inputs:
      public_origin:
        description: "Public VPS origin for web/API simulation."
        required: false
        default: "http://43.157.203.226:8080"
      expected_host:
        description: "Expected VPS host. Empty value skips host pin check."
        required: false
        default: "43.157.203.226"
      staging_deploy_path:
        description: "Deploy path containing staging compose/env. Empty value uses STAGING_DEPLOY_PATH."
        required: false
        default: ""
      run_mqtt_internal:
        description: "Run MQTT loopback inside the VPS Docker network."
        required: true
        type: boolean
        default: true
      run_write_uat:
        description: "Run pilot UAT write flow after read-only simulation."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulate:
    name: Simulate public VPS access
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USERNAME: ${{ vars.VPS_USERNAME }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      STAGING_DEPLOY_PATH: ${{ inputs.staging_deploy_path || vars.STAGING_DEPLOY_PATH || '/opt/pamilo/staging' }}
      PAMILO_PUBLIC_VPS_BASE_URL: ${{ inputs.public_origin }}
      PAMILO_PUBLIC_VPS_ORIGIN: ${{ inputs.public_origin }}
      PAMILO_PUBLIC_VPS_EXPECTED_HOST: ${{ inputs.expected_host }}
      PAMILO_PUBLIC_VPS_ALLOW_HTTP: "true"
      PAMILO_PUBLIC_VPS_ENVIRONMENT: staging
      PAMILO_UAT_EMAIL: ${{ vars.PAMILO_UAT_EMAIL || 'farmer-a@example.test' }}
      PAMILO_UAT_PASSWORD: ${{ secrets.PAMILO_UAT_PASSWORD || 'local-demo-password' }}
      PAMILO_UAT_TENANT_ID: ${{ vars.PAMILO_UAT_TENANT_ID || 'tenant-a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - name: Run public web/API simulation
        run: npm run simulate:public-vps

      - name: Validate VPS SSH configuration
        if: ${{ inputs.run_mqtt_internal }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -n "$VPS_PASSWORD" ]; then
            echo "::add-mask::$VPS_PASSWORD"
          fi

          for name in VPS_HOST VPS_PORT VPS_USERNAME VPS_PASSWORD STAGING_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret or variable is required for MQTT simulation."
              missing=1
            fi
          done

          if [ -n "$VPS_HOST" ] && ! [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::VPS_HOST must be a hostname or IPv4 address."
            missing=1
          fi

          if [ -n "$VPS_PORT" ] && ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS_PORT must be numeric."
            missing=1
          elif [ -n "$VPS_PORT" ] && { [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; }; then
            echo "::error::VPS_PORT must be between 1 and 65535."
            missing=1
          fi

          if [ -n "$VPS_USERNAME" ] && ! [[ "$VPS_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::VPS_USERNAME contains unsupported characters."
            missing=1
          fi

          if ! [[ "$STAGING_DEPLOY_PATH" =~ ^/opt/pamilo/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::STAGING_DEPLOY_PATH must stay under /opt/pamilo."
            missing=1
          elif [[ "$STAGING_DEPLOY_PATH" == *"/../"* || "$STAGING_DEPLOY_PATH" == *"/.." || "$STAGING_DEPLOY_PATH" == *"/./"* || "$STAGING_DEPLOY_PATH" == *"/." ]]; then
            echo "::error::STAGING_DEPLOY_PATH must not contain relative path segments."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install password SSH client
        if: ${{ inputs.run_mqtt_internal }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH known hosts
        if: ${{ inputs.run_mqtt_internal }}
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set. Pin the host key before production workflows."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Run internal MQTT loopback simulation
        if: ${{ inputs.run_mqtt_internal }}
        shell: bash
        run: |
          set -euo pipefail

          report_dir=".local/public-vps-simulation"
          mkdir -p "$report_dir"
          export SSHPASS="$VPS_PASSWORD"

          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o BatchMode=no \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" \
            "DEPLOY_PATH='$STAGING_DEPLOY_PATH' bash -s" <<'REMOTE' | tee "$report_dir/mqtt-internal-loopback.txt"
          set -euo pipefail

          topic="pamilo/v1/tenants/tenant-a/devices/device-a/telemetry"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          seq="$(date -u +%s)"
          payload="{\"v\":1,\"device_id\":\"device-a\",\"node_id\":\"vps-sim-01\",\"ts\":\"$ts\",\"seq\":$seq,\"m\":{\"st\":27.4,\"sm\":43.1},\"q\":{\"calibration_profile\":\"vps-simulation\",\"flags\":[]}}"

          cd "$DEPLOY_PATH"
          sudo -n docker compose --env-file staging.env -f compose.staging.yaml up -d mosquitto
          sudo -n docker compose --env-file staging.env -f compose.staging.yaml exec -T mosquitto sh -c '
            set -eu
            topic="$1"
            payload="$2"
            rm -f /tmp/pamilo-mqtt-simulation.out
            mosquitto_sub -i "pamilo-gh-sub-$$" -h 127.0.0.1 -p 1883 -C 1 -W 8 -t "$topic" > /tmp/pamilo-mqtt-simulation.out &
            sub_pid="$!"
            sleep 1
            mosquitto_pub -i "pamilo-gh-pub-$$" -h 127.0.0.1 -p 1883 -t "$topic" -m "$payload"
            wait "$sub_pid"
            test -s /tmp/pamilo-mqtt-simulation.out
          ' sh "$topic" "$payload"

          sleep 3

          latest="$(sudo -n docker compose --env-file staging.env -f compose.staging.yaml exec -T redis redis-cli HGET pamilo:telemetry:latest:tenant-a:plot-a soil_temperature | tr -d '\r')"
          printf '%s' "$latest" | grep -F '"nodeId":"vps-sim-01"'
          printf '%s' "$latest" | grep -F "\"seq\":$seq"

          sudo -n docker compose --env-file staging.env -f compose.staging.yaml exec -T api node -e '
            (async () => {
              const ts = process.argv[1];
              const url = new URL("http://victoriametrics:8428/api/v1/query_range");
              url.searchParams.set("query", "pamilo_telemetry_value{tenant_id=\"tenant-a\",plot_id=\"plot-a\",metric=\"soil_temperature\"}");
              url.searchParams.set("start", new Date(Date.parse(ts) - 1000).toISOString());
              url.searchParams.set("end", new Date(Date.parse(ts) + 1000).toISOString());
              url.searchParams.set("step", "1s");
              const response = await fetch(url);
              const body = await response.json();
              const result = Array.isArray(body?.data?.result) ? body.data.result : [];
              const values = result.flatMap((series) => Array.isArray(series.values) ? series.values : []);
              if (!values.some((point) => Array.isArray(point) && Number(point[1]) === 27.4)) {
                throw new Error("VictoriaMetrics did not return the MQTT simulation point.");
              }
            })().catch((error) => {
              console.error(error instanceof Error ? error.message : String(error));
              process.exit(1);
            });
          ' "$ts"

          echo "MQTT internal loopback passed"
          echo "MQTT storage write passed"
          echo "topic=$topic"
          echo "payload_ts=$ts"
          echo "payload_seq=$seq"
          REMOTE

      - name: Run optional write UAT
        if: ${{ inputs.run_write_uat }}
        env:
          PAMILO_UAT_ENVIRONMENT: staging
          PAMILO_UAT_BASE_URL: ${{ inputs.public_origin }}
          PAMILO_UAT_ORIGIN: ${{ inputs.public_origin }}
          PAMILO_UAT_WRITE: "true"
        run: npm run uat:pilot

      - name: Upload simulation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-vps-simulation
          path: |
            .local/public-vps-simulation/
            .local/pilot-uat/
          if-no-files-found: warn
