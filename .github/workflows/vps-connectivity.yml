name: VPS Connectivity Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: Check SSH access
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USERNAME: ${{ vars.VPS_USERNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in VPS_HOST VPS_PORT VPS_USERNAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository variable is required."
              missing=1
            fi
          done

          if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
            echo "::error::VPS_SSH_PRIVATE_KEY repository secret is required."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/pamilo_vps
          chmod 600 ~/.ssh/pamilo_vps

          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set. Pin the host key before production deploy workflows."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Run read-only SSH check
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/pamilo_vps \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" \
            'set -eu; echo "connected"; whoami; hostname; docker --version || true'
