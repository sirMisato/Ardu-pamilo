name: VPS Connectivity Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: Check SSH access
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USERNAME: ${{ vars.VPS_USERNAME }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -n "$VPS_PASSWORD" ]; then
            echo "::add-mask::$VPS_PASSWORD"
          fi

          for name in VPS_HOST VPS_PORT VPS_USERNAME VPS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret or variable is required."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install password SSH client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set. Pin the host key before production deploy workflows."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Run read-only SSH check
        shell: bash
        run: |
          set -euo pipefail

          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o BatchMode=no \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" \
            'set -eu; echo "connected"; whoami; hostname; docker --version || true'
